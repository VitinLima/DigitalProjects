#bankdef mybank
{
    bits = 24
    addr = 0x0
    size = 0xFF_FFFF_FFFF
    outp = 24 * 0x0
}
#ruledef
{
HALT                      => 0b00000 @ 0b0 @ 0b0000 @ 0b0000_0000     @ 0`6

LOAD     r{reg1}, r{reg2} => 0b00001 @ 0b0 @ 0b0000 @ reg2`4 @ reg1`4 @ 0`6
LOADK    r{reg1}, {val}   => 0b00001 @ 0b1 @ val`8           @ reg1`4 @ 0`6

AND      r{reg1}, r{reg2} => 0b00010 @ 0b0 @ 0b0000 @ reg2`4 @ reg1`4 @ 0`6
ANDK     r{reg1}, {val}   => 0b00010 @ 0b1 @ val`8           @ reg1`4 @ 0`6
OR       r{reg1}, r{reg2} => 0b00011 @ 0b0 @ 0b0000 @ reg2`4 @ reg1`4 @ 0`6
ORK      r{reg1}, {val}   => 0b00011 @ 0b1 @ val`8           @ reg1`4 @ 0`6
XOR      r{reg1}, r{reg2} => 0b00100 @ 0b0 @ 0b0000 @ reg2`4 @ reg1`4 @ 0`6
XORK     r{reg1}, {val}   => 0b00100 @ 0b1 @ val`8           @ reg1`4 @ 0`6
TEST     r{reg1}, r{reg2} => 0b00101 @ 0b0 @ 0b0000 @ reg2`4 @ reg1`4 @ 0`6
TESTK    r{reg1}, {va}l   => 0b00101 @ 0b1 @ val`8           @ reg1`4 @ 0`6

ADD      r{reg1}, r{reg2} => 0b00110 @ 0b0 @ 0b0000 @ reg2`4 @ reg1`4 @ 0`6
ADDK     r{reg1}, {val}   => 0b00110 @ 0b1 @ val`8           @ reg1`4 @ 0`6
ADDCY    r{reg1}, r{reg2} => 0b00111 @ 0b0 @ 0b0000 @ reg2`4 @ reg1`4 @ 0`6
ADDKCY   r{reg1}, {val}   => 0b00111 @ 0b1 @ val`8           @ reg1`4 @ 0`6
SUB      r{reg1}, r{reg2} => 0b01000 @ 0b0 @ 0b0000 @ reg2`4 @ reg1`4 @ 0`6
SUBK     r{reg1}, {val}   => 0b01000 @ 0b1 @ val`8           @ reg1`4 @ 0`6
SUBCY    r{reg1}, r{reg2} => 0b01001 @ 0b0 @ 0b0000 @ reg2`4 @ reg1`4 @ 0`6
SUBKCY   r{reg1}, {val}   => 0b01001 @ 0b1 @ val`8           @ reg1`4 @ 0`6
COMPARE  r{reg1}, r{reg2} => 0b01010 @ 0b0 @ 0b0000 @ reg2`4 @ reg1`4 @ 0`6
COMPAREK r{reg1}, {val}   => 0b01010 @ 0b1 @ val`8           @ reg1`4 @ 0`6

SR0      r{reg1}    => 0b01011 @ 0b0 @ 0b0000_0000 @ reg1`4
SR1      r{reg1}    => 0b01100 @ 0b0 @ 0b0000_0000 @ reg1`4
SRX      r{reg1}    => 0b01101 @ 0b0 @ 0b0000_0000 @ reg1`4
SRA      r{reg1}    => 0b01110 @ 0b0 @ 0b0000_0000 @ reg1`4
RR       r{reg1}    => 0b01111 @ 0b0 @ 0b0000_0000 @ reg1`4
SL0      r{reg1}    => 0b10000 @ 0b0 @ 0b0000_0000 @ reg1`4
SL1      r{reg1}    => 0b10001 @ 0b0 @ 0b0000_0000 @ reg1`4
SLX      r{reg1}    => 0b10010 @ 0b0 @ 0b0000_0000 @ reg1`4
SLA      r{reg1}    => 0b10011 @ 0b0 @ 0b0000_0000 @ reg1`4
RL       r{reg1}    => 0b10100 @ 0b0 @ 0b0000_0000 @ reg1`4

INPUT   r{reg1}, r{reg2} => 0b10101 @ 0b0 @ 0b0000 @ reg1`4 @ reg2`4 @ 0`6
INPUTK  r{reg1}, {pp}    => 0b10101 @ 0b1 @ pp`8   @ reg1`4          @ 0`6
OUTPUT  r{reg1}, r{reg2} => 0b10110 @ 0b0 @ 0b0000 @ reg2`4 @ reg1`4 @ 0`6
OUTPUTK r{reg1}, {pp}    => 0b10110 @ 0b1 @ pp`8   @ reg1`4          @ 0`6

JUMP   {aaa}   => 0b10111 @ 0b0 @ aaa`10 @ 0b00     @ 0`6
JUMPZ  {aaa}   => 0b10111 @ 0b1 @ aaa`10 @ 0b01     @ 0`6
JUMPNZ {aaa}   => 0b10111 @ 0b1 @ aaa`10 @ 0b10     @ 0`6
JUMPC  {aaa}   => 0b10111 @ 0b1 @ aaa`10 @ 0b11     @ 0`6
JUMPNC {aaa}   => 0b10111 @ 0b1 @ aaa`10 @ 0b00     @ 0`6
CALL   {aaa}   => 0b11000 @ 0b0 @ aaa`10 @ 0b00     @ 0`6
CALLZ  {aaa}   => 0b11000 @ 0b1 @ aaa`10 @ 0b01     @ 0`6
CALLNZ {aaa}   => 0b11000 @ 0b1 @ aaa`10 @ 0b10     @ 0`6
CALLC  {aaa}   => 0b11000 @ 0b1 @ aaa`10 @ 0b11     @ 0`6
CALLNC {aaa}   => 0b11000 @ 0b1 @ aaa`10 @ 0b00     @ 0`6
RETURN         => 0b11001 @ 0b0 @ 0b00_0000_0000_00 @ 0`6
RETURNZ        => 0b11001 @ 0b1 @ 0b00_0000_0000_01 @ 0`6
RETURNNZ       => 0b11001 @ 0b1 @ 0b00_0000_0000_10 @ 0`6
RETURNC        => 0b11001 @ 0b1 @ 0b00_0000_0000_11 @ 0`6
RETURNNC       => 0b11001 @ 0b1 @ 0b00_0000_0000_00 @ 0`6

STORE r{reg1}, addr     => 0b11010 @ 0b0 @ reg1`4 @ addr`8
STORE r{reg1}, r{reg2}  => 0b11010 @ 0b1 @ reg1`4 @ reg2`4 @ 0b0000
FETCH r{reg1}, addr     => 0b11011 @ 0b0 @ reg1`4 @ addr`8
FETCH r{reg1}, r{reg2}  => 0b11011 @ 0b1 @ reg1`4 @ reg2`4 @ 0b0000

ENABLEI    => 0b11100 @ 0b1 @ 0b0000 @ 0b0000_0000
DISABLEI   => 0b11100 @ 0b0 @ 0b0000 @ 0b0000_0000
RETURNI EN  => 0b11101 @ EN`1 @ 0b0000 @ 0b0000_0000
ISRADDRESS addr => 0b11110 @ 0b000 @ addr`10
}

main:
    CALL .multiply3x4
    OUTPUTK r1, 0

    .end:
        HALT
        JUMP .end

.multiply3x4:
    LOADK r1, 0
    LOADK r2, 3
    LOADK r3, 4
    
    .loop:
        ADD r1, r2
        SUBK r3, 1
        JUMPNZ .loop
    
    RETURN



